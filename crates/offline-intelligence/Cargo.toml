[package]
name = "offline-intelligence"
version = "0.1.5"
description = "High-performance library for offline AI inference with context management, memory, and thread-based server architecture"
license = "Apache-2.0"
repository = "https://github.com/OfflineIntelligence/offline-intelligence"
homepage = "https://github.com/OfflineIntelligence/offline-intelligence"
keywords = ["llm", "ai", "inference", "offline", "local"]
categories = ["web-programming", "science", "network-programming"]
readme = "README.md"
edition = "2021"

[lib]
name = "offline_intelligence"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "offline-intelligence"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
prometheus = "0.13"
lazy_static = "1.4"
tower = { version = "0.4", features = ["limit", "buffer", "util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "timeout", "limit"] }
sysinfo = "0.30"
nvml-wrapper = { version = "0.10", optional = true }
num_cpus = "1.16"
futures = "0.3"
futures-util = "0.3"
gguf = "0.1"
flate2 = "1.0"
tar = "0.4"
zip = "1.1"
clap = { version = "4.4", features = ["derive"] }
dashmap = "5.5"
rusqlite = { version = "0.32", features = ["bundled", "functions", "modern_sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
regex = "1.10"
blake3 = "1.5"
bincode = "1.3"
rand = "0.8"
moka = { version = "0.12", features = ["future", "sync"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
hora = "0.1"
validator = { version = "0.16", features = ["derive"] }
rayon = "1.8"
bytes = "1.5"
which = "1.0"
crossbeam-queue = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3"
tokio-stream = "0.1"
pin-project-lite = "0.2"
async-trait = "0.1"
arc-swap = "1.7"

dirs = "5.0"
walkdir = "2.4"
fs2 = "0.4"
tempfile = "3.8"
whoami = "1.5"

base64 = "0.22"
mime_guess = "2.0"

lettre = { version = "0.11", features = ["tokio1-native-tls", "builder", "smtp-transport"] }

jsonwebtoken = "9"
argon2 = "0.5"
hex = "0.4"

calamine = "0.26"

lopdf = "0.32"

png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-vision = "0.3"
objc2-foundation = "0.2"
core-graphics = "0.23"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", features = [
    "Data_Pdf",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Foundation",
    "Win32_System_WinRT",
] }

[features]
default = []
nvidia = ["nvml-wrapper"]

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.2"
proptest = "1.4"
